steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADMIN_PASSWORD=$_NEXT_PUBLIC_ADMIN_PASSWORD'
      - '--build-arg'
      - 'GCS_BUCKET=$_GCS_BUCKET'
      - '-t'
      - 'gcr.io/crisp-website-485112/crisp-website:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
images:
  - 'gcr.io/crisp-website-485112/crisp-website:latest'
