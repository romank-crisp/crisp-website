<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 to WebM Converter</title>
    <meta name="description" content="Fast and simple MP4 to WebM video converter with custom file naming">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="icon-wrapper">
                <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M10 15L12 13L14 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M12 13V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
            <h1>MP4 to WebM Converter</h1>
            <p class="subtitle">Fast, simple video conversion</p>
        </header>

        <main class="main-content">
            <!-- Upload Section -->
            <div class="upload-section" id="uploadSection">
                <div class="drop-zone" id="dropZone">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <h2>Drop MP4 file here</h2>
                    <p>or click to browse</p>
                    <input type="file" id="fileInput" accept="video/mp4,.mp4" hidden>
                </div>
            </div>

            <!-- File Info & Settings Section -->
            <div class="settings-section hidden" id="settingsSection">
                <div class="file-info">
                    <div class="file-preview">
                        <svg class="file-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M13 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V9L13 2Z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13 2V9H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <div class="file-details">
                            <h3 id="fileName">video.mp4</h3>
                            <p id="fileSize">0 MB</p>
                        </div>
                    </div>
                    <button class="btn-secondary" id="changeFileBtn">Change File</button>
                </div>

                <div class="input-group">
                    <label for="outputName">Output File Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="outputName" placeholder="Enter file name" value="">
                        <span class="extension">.webm</span>
                    </div>
                </div>

                <div class="quality-selector">
                    <label>Quality Preset</label>
                    <div class="quality-options">
                        <button class="quality-btn" data-quality="high">High</button>
                        <button class="quality-btn active" data-quality="medium">Medium</button>
                        <button class="quality-btn" data-quality="low">Low</button>
                    </div>
                </div>

                <div class="audio-options" style="margin-top: 20px; margin-bottom: 24px;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary); font-size: 0.9rem;">
                        <input type="checkbox" id="removeAudio" style="width: 16px; height: 16px; cursor: pointer;">
                        <span>Remove Audio (Mute Video)</span>
                    </label>
                </div>

                <button class="btn-primary" id="convertBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21.5 2V8H15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M2.5 22V16H8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path
                            d="M2.04999 12C2.04999 10.4241 2.51649 8.88092 3.39499 7.55585C4.27349 6.23078 5.52649 5.18373 6.99999 4.54C8.47349 3.89627 10.1 3.68509 11.6725 3.93245C13.245 4.17981 14.7 4.87504 15.87 5.93L21.5 8M2.5 16L8.13 18.07C9.3 19.125 10.755 19.8202 12.3275 20.0676C13.9 20.3149 15.5265 20.1037 17 19.46C18.4735 18.8163 19.7265 17.7692 20.605 16.4442C21.4835 15.1191 21.95 13.5759 21.95 12"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Convert to WebM
                </button>
            </div>

            <!-- Progress Section -->
            <div class="progress-section hidden" id="progressSection">
                <div class="progress-content">
                    <div class="spinner"></div>
                    <h3>Converting...</h3>
                    <p id="progressText">Processing your video</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <!-- Success Section -->
            <div class="success-section hidden" id="successSection">
                <div class="success-content">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M22 11.08V12C21.9988 14.1564 21.3005 16.2547 20.0093 17.9818C18.7182 19.7088 16.9033 20.9725 14.8354 21.5839C12.7674 22.1953 10.5573 22.1219 8.53447 21.3746C6.51168 20.6273 4.78465 19.2461 3.61096 17.4371C2.43727 15.628 1.87979 13.4881 2.02168 11.3363C2.16356 9.18455 2.99721 7.13631 4.39828 5.49706C5.79935 3.85781 7.69279 2.71537 9.79619 2.24013C11.8996 1.7649 14.1003 1.98232 16.07 2.85999"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M22 4L12 14.01L9 11.01" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h3>Conversion Complete!</h3>
                    <p id="successFileName">video.webm</p>
                    <p class="subtitle" style="margin-top: 8px; opacity: 0.7;">File saved to Desktop</p>
                    <div class="success-actions">
                        <button class="btn-primary" id="downloadBtn">Download File</button>
                        <button class="btn-secondary" id="convertAnotherBtn">Convert Another</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by FFmpeg</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
